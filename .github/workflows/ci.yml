name: techgroup-enterprise-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  grpc-contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26.1"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.9
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Check grpc contract drift
        run: python scripts/check_grpc_stub_drift.py

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [grpc-contract-drift]
    env:
      TRAVEL_EVENT_BUS: local
      TRAVEL_EVENT_BUS_STRICT: "false"
      TRAVEL_A2A_AUDIT_MIRROR_PULSAR: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python unit tests
        run: python scripts/run_python_tests_ci.py

  gateway-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [grpc-contract-drift]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run gateway tests
        run: mvn -f services/techgroup-enterprise-travel-gateway/pom.xml -DskipTests=false test

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/techgroup-enterprise-travel-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/techgroup-enterprise-travel-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run ci:build

