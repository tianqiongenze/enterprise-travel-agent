name: CI-CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  java-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run maven tests
        run: mvn -B test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build web client
        run: |
          npm install
          npm run build

  miniapp-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate miniapp required files
        run: |
          test -f miniapp-wechat/app.json
          test -f miniapp-wechat/pages/index/index.js
          test -f miniapp-wechat/pages/index/index.wxml
          test -f miniapp-wechat/pages/index/index.wxss

  go-ranker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-ranker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build go-ranker binary
        run: |
          go mod tidy
          go build -v ./...
      - name: Build go-ranker container
        run: |
          docker build -t go-ranker:ci .

  go-policy-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build go-policy binary
        run: |
          go mod tidy
          go build -v ./...
      - name: Build go-policy container
        run: |
          docker build -t go-policy:ci .

  go-fanout-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-fanout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build go-fanout binary
        run: |
          go mod tidy
          go build -v ./...
      - name: Build go-fanout container
        run: |
          docker build -t go-fanout:ci .

  go-registry-cache-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-registry-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Build go-registry-cache binary
        run: |
          go mod tidy
          go build -v ./...
      - name: Build go-registry-cache container
        run: |
          docker build -t go-registry-cache:ci .

  build-image:
    needs: [python-tests, java-tests, web-build, miniapp-structure-check, go-ranker-build, go-policy-build, go-fanout-build, go-registry-cache-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build placeholder image
        run: echo "Build and push images here"

  kustomize-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate kustomize overlays exist
        run: |
          test -f deploy/k8s/kustomize/base/kustomization.yaml
          test -f deploy/k8s/kustomize/overlays/dev/kustomization.yaml
          test -f deploy/k8s/kustomize/overlays/staging/kustomization.yaml
          test -f deploy/k8s/kustomize/overlays/prod/kustomization.yaml

  canary-deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [build-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canary deploy placeholder
        run: echo "Deploy canary and evaluate SLO gates"
      - name: Enforce canary gate when report exists
        run: |
          if [ -f stress/etcd_migration_compare.json ]; then
            bash deploy/scripts/canary_promote_or_rollback.sh stress/etcd_migration_compare.json
          else
            echo "canary report not found, skip gate"
          fi
