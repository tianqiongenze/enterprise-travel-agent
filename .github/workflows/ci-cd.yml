name: CI-CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  setup-image-meta:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_repo_prefix: ${{ steps.vars.outputs.image_repo_prefix }}
    steps:
      - id: vars
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          REPO_PREFIX="${IMAGE_REPO_PREFIX:-ghcr.io/${GITHUB_REPOSITORY}}"
          echo "image_repo_prefix=${REPO_PREFIX}" >> "$GITHUB_OUTPUT"

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint (correctness rules)
        run: |
          ruff check services/techgroup-enterprise-travel-runtime/src tests scripts stress platform/deploy/scripts \
            --select E9,F63,F7,F82,F401,F841 --exclude "*/gen/*,*/generated/*"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-otel-optional.txt
          pip install aiosqlite coverage
      - name: Run tests with coverage
        run: |
          TRAVEL_EVENT_BUS=local TRAVEL_EVENT_BUS_STRICT=false TRAVEL_A2A_AUDIT_MIRROR_PULSAR=false \
          PYTHONPATH="$PWD/services/techgroup-enterprise-travel-runtime" \
          coverage run --source=services/techgroup-enterprise-travel-runtime/src \
            -m unittest discover -s tests -p "test_*.py"
          coverage report --fail-under=50
          coverage xml -o coverage-python.xml
      - name: Assert OTel trace wiring (spans + X-Trace-Id bridge)
        run: |
          TRAVEL_OTEL_ENABLED=true TRAVEL_OTEL_ENDPOINT=http://localhost:4317 \
          PYTHONPATH="$PWD/services/techgroup-enterprise-travel-runtime" \
          python -m pytest tests/test_otel_tracing.py -q

  java-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/techgroup-enterprise-travel-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run maven tests
        run: mvn -B test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/techgroup-enterprise-travel-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, test and build web client
        run: |
          npm ci
          npm test
          npm run build

  miniapp-structure-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate miniapp required files
        run: |
          test -f miniapp-wechat/app.json
          test -f miniapp-wechat/pages/index/index.js
          test -f miniapp-wechat/pages/index/index.wxml
          test -f miniapp-wechat/pages/index/index.wxss

  go-ranker-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/techgroup-enterprise-travel-ranker-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: gofmt / vet / test / build
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -v ./...
      - name: Build go-ranker container
        run: |
          docker build -t go-ranker:ci .

  go-policy-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/techgroup-enterprise-travel-policy-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: gofmt / vet / test / build
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -v ./...
      - name: Build go-policy container
        run: |
          docker build -t go-policy:ci .

  go-fanout-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/techgroup-enterprise-travel-fanout-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: gofmt / vet / test / build
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -v ./...
      - name: Build go-fanout container
        run: |
          docker build -t go-fanout:ci .

  go-registry-cache-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/techgroup-enterprise-travel-registry-cache-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: gofmt / vet / test / build
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -v ./...
      - name: Build go-registry-cache container
        run: |
          docker build -t go-registry-cache:ci .

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (vuln + IaC, gate on CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,config,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

  build-image:
    needs: [setup-image-meta, python-lint, python-tests, java-tests, web-build, miniapp-structure-check, go-ranker-build, go-policy-build, go-fanout-build, go-registry-cache-build, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO_PREFIX: ${{ needs.setup-image-meta.outputs.image_repo_prefix }}
      IMAGE_TAG: ${{ needs.setup-image-meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/deploy/docker/Dockerfile.travel-agent-api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_REPO_PREFIX }}/travel-agent-api:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO_PREFIX }}/travel-agent-api:latest
      - name: Build Gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/deploy/docker/Dockerfile.travel-gateway
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_REPO_PREFIX }}/travel-gateway:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO_PREFIX }}/travel-gateway:latest
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: platform/deploy/docker/Dockerfile.travel-web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_REPO_PREFIX }}/travel-web:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_REPO_PREFIX }}/travel-web:latest

  kustomize-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate kustomize overlays exist
        run: |
          test -f platform/deploy/k8s/kustomize/base/kustomization.yaml
          test -f platform/deploy/k8s/kustomize/overlays/dev/kustomization.yaml
          test -f platform/deploy/k8s/kustomize/overlays/staging/kustomization.yaml
          test -f platform/deploy/k8s/kustomize/overlays/prod/kustomization.yaml
          test -f platform/deploy/k8s/kustomize/overlays/region-a/kustomization.yaml
          test -f platform/deploy/k8s/kustomize/overlays/region-b/kustomization.yaml
          test -f platform/deploy/k8s/kustomize/overlays/region-c/kustomization.yaml

  canary-deploy:
    # Deploy jobs never run silently: they require the repository variable
    # TRAVEL_DEPLOY_ENABLED=true AND an environment-scoped kube context.
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      && vars.TRAVEL_DEPLOY_ENABLED == 'true'
    needs: [setup-image-meta, build-image, kustomize-check]
    runs-on: ubuntu-latest
    environment: production-deploy
    env:
      IMAGE_REPO_PREFIX: ${{ needs.setup-image-meta.outputs.image_repo_prefix }}
      IMAGE_TAG: ${{ needs.setup-image-meta.outputs.image_tag }}
    strategy:
      matrix:
        overlay: [staging, region-a, region-b, region-c]
    steps:
      - uses: actions/checkout@v4
      - name: Enforce canary gate when report exists
        run: |
          if [ -f stress/etcd_migration_compare.json ]; then
            bash platform/deploy/scripts/canary_promote_or_rollback.sh stress/etcd_migration_compare.json
            ACTION=$(python3 -c "import json; from pathlib import Path; payload=json.loads(Path('stress/canary_gate_decision.json').read_text(encoding='utf-8')); print(payload.get('action','rollback'))")
            if [ "$ACTION" = "promote" ]; then
              echo "canary promoted for overlay=${{ matrix.overlay }}"
              if command -v kubectl >/dev/null 2>&1 && kubectl config current-context >/dev/null 2>&1; then
                KUSTOMIZE_OVERLAY=${{ matrix.overlay }} bash platform/deploy/scripts/deploy_release.sh
              else
                echo "::error::kube context missing - cannot deploy overlay=${{ matrix.overlay }}"
                exit 1
              fi
            else
              echo "canary rollback for overlay=${{ matrix.overlay }}"
              exit 1
            fi
          else
            echo "canary report not found"
            exit 1
          fi
