apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: travel-agent-a2a-metrics
    component: metrics-exporter
  name: travel-agent-a2a-metrics-exporter
spec:
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: travel-agent-a2a-metrics
            component: metrics-exporter
        spec:
          containers:
          - command:
            - sh
            - -c
            - |
              python -u platform/deploy/scripts/export_a2a_stream_metrics.py
              sleep ${TRAVEL_A2A_METRICS_SCRAPE_GRACE_SEC:-45}
            env:
            - name: TRAVEL_A2A_REDIS_URL
              value: redis://redis-cluster.default.svc.cluster.local:7000
            - name: TRAVEL_A2A_KEY_PREFIX
              value: a2a:stream
            - name: TRAVEL_A2A_STREAM_GROUP
              value: a2a-consumers
            - name: TRAVEL_A2A_METRICS_PATH
              value: /metrics/a2a_stream_metrics.prom
            image: enterprise-travel-agent-api:staging
            imagePullPolicy: IfNotPresent
            name: a2a-metrics-exporter
            volumeMounts:
            - mountPath: /metrics
              name: a2a-metrics
          - command:
            - python
            - -m
            - http.server
            - "9909"
            - --directory
            - /metrics
            image: python:3.12-slim
            imagePullPolicy: IfNotPresent
            name: a2a-metrics-http
            ports:
            - containerPort: 9909
              name: metrics
            volumeMounts:
            - mountPath: /metrics
              name: a2a-metrics
          restartPolicy: OnFailure
          volumes:
          - emptyDir: {}
            name: a2a-metrics
  schedule: '*/1 * * * *'
  successfulJobsHistoryLimit: 2
