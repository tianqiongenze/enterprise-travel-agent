apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: travel-agent
    release: kube-prometheus-stack
  name: travel-agent-a2a-metrics
spec:
  endpoints:
  - interval: 30s
    path: /a2a_stream_metrics.prom
    port: metrics
    scrapeTimeout: 10s
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app: travel-agent-a2a-metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: travel-agent
  name: travel-agent-api-servicemonitor
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: metrics
    scrapeTimeout: 10s
  namespaceSelector:
    any: true
  selector:
    matchLabels:
