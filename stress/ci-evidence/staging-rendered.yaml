apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app: travel-agent
  name: travel-agent-runtime-alerts
spec:
  groups:
  - name: groupcache-runtime.rules
    rules:
    - alert: GroupcachePeersTooLow
      annotations:
        description: groupcache peer count is below 2 for over 5 minutes; peer discovery
          may be unhealthy.
        summary: groupcache peers below expected floor
      expr: groupcache_peers_count < 2
      for: 5m
      labels:
        component: go-registry-cache
        severity: warning
    - alert: GroupcachePeerRefreshStale
      annotations:
        description: go-registry-cache has not refreshed endpoint peers in the last
          120 seconds.
        summary: groupcache peer refresh is stale
      expr: time() - groupcache_peer_refresh_timestamp > 120
      for: 5m
      labels:
        component: go-registry-cache
        severity: critical
    - alert: GroupcachePeerRefreshErrorsIncreasing
      annotations:
        description: go-registry-cache endpoint refresh errors increased over the
          last 10 minutes.
        summary: groupcache refresh errors detected
      expr: increase(groupcache_peer_refresh_errors_total[10m]) > 0
      for: 10m
      labels:
        component: go-registry-cache
        severity: warning
  - name: canary-gate.rules
    rules:
    - alert: CanaryGateRollbackDecision
      annotations:
        description: canary gate evaluated rollback. Check canary drift and revert/pause
          promotion.
        summary: canary gate currently in rollback state
      expr: canary_gate_status == 0
      for: 2m
      labels:
        component: canary-gate
        severity: critical
    - alert: CanaryGateSuccessGapExceeded
      annotations:
        description: success rate gap is above configured threshold for canary gate.
        summary: canary success-rate gap exceeded
      expr: canary_gate_success_rate_gap > canary_gate_threshold_success_gap
      for: 2m
      labels:
        component: canary-gate
        severity: critical
    - alert: CanaryGateP95DriftExceeded
      annotations:
        description: p95 latency drift ratio is above threshold for canary gate.
        summary: canary p95 drift exceeded
      expr: canary_gate_p95_drift_ratio > canary_gate_threshold_p95_drift
      for: 2m
      labels:
        component: canary-gate
        severity: warning
    - alert: CanaryGateP99DriftExceeded
      annotations:
        description: p99 latency drift ratio is above threshold for canary gate.
        summary: canary p99 drift exceeded
      expr: canary_gate_p99_drift_ratio > canary_gate_threshold_p99_drift
      for: 2m
      labels:
        component: canary-gate
        severity: warning
    - alert: CanaryGateMetricsStale
      annotations:
        description: No fresh canary gate evaluation has been published in the last
          15 minutes.
        summary: canary gate metrics are stale
      expr: time() - canary_gate_last_eval_timestamp > 900
      for: 5m
      labels:
        component: canary-gate
        severity: warning
  - name: event-consumer.rules
    rules:
    - alert: EventConsumerLagHigh
      annotations:
        description: event consumer lag has exceeded 60 seconds for over 5 minutes.
        summary: event consumer lag is high
      expr: travel_event_consumer_lag_seconds > 60
      for: 5m
      labels:
        component: event-consumer
        severity: warning
    - alert: EventConsumerDLQIncreasing
      annotations:
        description: DLQ count increased in the last 10 minutes. Check failing handlers
          or malformed events.
        summary: event consumer DLQ traffic detected
      expr: increase(travel_event_consumer_dlq_total[10m]) > 0
      for: 10m
      labels:
        component: event-consumer
        severity: critical
    - alert: EventConsumerNoProgress
      annotations:
        description: No processed events recorded in the last 10 minutes.
        summary: event consumer has no processing progress
      expr: increase(travel_event_consumer_processed_total[10m]) == 0
      for: 10m
      labels:
        component: event-consumer
        severity: warning
    - alert: EventConsumerHandlerFailuresIncreasing
      annotations:
        description: Handler failures increased in the last 10 minutes. Review retry
          policy and downstream dependencies.
        summary: event consumer handler failures detected
      expr: increase(travel_event_consumer_handler_failures_total[10m]) > 0
      for: 10m
      labels:
        component: event-consumer
        severity: warning
    - alert: EventConsumerQueueFullDropsIncreasing
      annotations:
        description: Worker queue reached capacity and dropped/requeued messages in
          last 10 minutes.
        summary: event consumer queue full drops detected
      expr: increase(travel_event_consumer_queue_full_drop_total[10m]) > 0
      for: 5m
      labels:
        component: event-consumer
        severity: warning
  - name: a2a-stream.rules
    rules:
    - alert: A2AStreamPendingHigh
      annotations:
        description: Redis Streams pending entries exceed 500 for over 5 minutes.
          Check consumers and retry throughput.
        summary: A2A stream pending backlog is high
      expr: travel_a2a_stream_pending_total > 500
      for: 5m
      labels:
        component: a2a-stream
        severity: warning
    - alert: A2AStreamLagHigh
      annotations:
        description: A2A stream lag exceeds 30 seconds. Investigate stream claim/ack
          latency.
        summary: A2A stream lag is high
      expr: travel_a2a_stream_lag_ms > 30000
      for: 5m
      labels:
        component: a2a-stream
        severity: warning
    - alert: A2AStreamMetricsStale
      annotations:
        description: No fresh A2A stream metrics exported in the last 10 minutes.
        summary: A2A stream metrics are stale
      expr: time() - travel_a2a_stream_metrics_timestamp > 600
      for: 5m
      labels:
        component: a2a-stream
        severity: warning
  - name: runtime-slo.rules
    rules:
    - expr: |
        sum(rate(http_requests_total{app="travel-agent-api",status=~"5.."}[5m]))
        /
        clamp_min(sum(rate(http_requests_total{app="travel-agent-api"}[5m])), 1)
      record: travel_agent_api_error_rate_5m
    - alert: TravelAgentAPIErrorRateHigh
      annotations:
        description: 5xx error-rate over last 5m is above 1%.
        summary: travel-agent-api error rate exceeds SLO
      expr: travel_agent_api_error_rate_5m > 0.01
      for: 5m
      labels:
        component: travel-agent-api
        severity: critical
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: travel-agent
  name: go-services-servicemonitor
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: metrics
    scrapeTimeout: 10s
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - go-ranker
      - go-policy
      - go-fanout
      - go-registry-cache
