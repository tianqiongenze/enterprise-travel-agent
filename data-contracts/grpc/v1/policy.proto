syntax = "proto3";

package techgroup.travel.grpc.v1;

import "common.proto";

option java_package = "com.techgroup.travel.contracts.grpc.v1";
option java_multiple_files = true;
option go_package = "github.com/techgroup/enterprise-travel-agent/data-contracts/grpc/v1;travelgrpcv1";

service PolicyService {
  rpc Evaluate(PolicyEvaluateRequest) returns (PolicyEvaluateResponse);
}

message PolicyEvaluateRequest {
  ContextHeaders context = 1;
  string policy_id = 2;
  string city = 3;
  int32 days = 4;
  double budget = 5;
  int32 travelers = 6;
  string membership_tier = 7;
  string orchestration_engine = 8;
  repeated string preferences = 9;
  int32 max_agent_steps = 10;
  int32 max_tool_calls = 11;
  repeated string allowed_tools = 12;
}

message PolicyEvaluateResponse {
  string decision = 1;
  string reason = 2;
}

