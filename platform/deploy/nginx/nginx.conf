worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=runtime_rate_limit:10m rate=5r/s;

  map $http_origin $cors_allow_origin {
    default "";
    ~^https?://(localhost(:[0-9]+)?|web\.example\.com)$ $http_origin;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" always;

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }

    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
      limit_req zone=api_rate_limit burst=30 nodelay;
      proxy_pass http://techgroup-enterprise-travel-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      if ($cors_allow_origin != "") {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
      }
      add_header Access-Control-Allow-Headers "Authorization,Content-Type,X-Trace-Id" always;
      add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
      add_header Access-Control-Allow-Credentials "true" always;
      if ($request_method = OPTIONS) {
        return 204;
      }
    }

    location /runtime/ {
      limit_req zone=runtime_rate_limit burst=15 nodelay;
      proxy_pass http://travel-agent-api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
