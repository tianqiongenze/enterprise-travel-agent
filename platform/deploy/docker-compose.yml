version: "3.9"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      - KEYCLOAK_ADMIN=${TRAVEL_KEYCLOAK_ADMIN:admin}
      - KEYCLOAK_ADMIN_PASSWORD=${TRAVEL_KEYCLOAK_ADMIN_PASSWORD:admin-change-me}
      - TRAVEL_OIDC_CLIENT_SECRET=${TRAVEL_OIDC_CLIENT_SECRET:change-me-travel-api-secret}
    volumes:
      - ./keycloak/realm-travel.json:/opt/keycloak/data/import/realm-travel.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -n 'GET /realms/travel HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 5s
      retries: 12

  techgroup-enterprise-travel-gateway:
    image: enterprise-travel-agent-gateway:local
    ports:
      - "8080:8080"
    environment:
      - TRAVEL_RUNTIME_BASE_URL=http://travel-agent-api:8000
      - TRAVEL_SECURITY_MODE=${TRAVEL_SECURITY_MODE:oauth2}
      - TRAVEL_OIDC_ISSUER=http://keycloak:8080/realms/travel
      - TRAVEL_INTERNAL_SHARED_SECRET=${TRAVEL_INTERNAL_SHARED_SECRET:}
    depends_on:
      - travel-agent-api
      - keycloak

  techgroup-enterprise-travel-web:
    image: enterprise-travel-agent-web:local
    ports:
      - "5173:80"
    environment:
      - VITE_TRAVEL_API_BASE_URL=http://localhost:8080
    depends_on:
      - techgroup-enterprise-travel-gateway

  nacos:
    image: nacos/nacos-server:v2.4.2
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - NACOS_AUTH_TOKEN=defaultBase64Token
    ports:
      - "8848:8848"

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: >
      /usr/local/bin/etcd --name etcd0 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
    ports:
      - "2379:2379"

  pulsar:
    image: apachepulsar/pulsar:3.3.2
    command: ["bin/pulsar", "standalone"]
    ports:
      - "6650:6650"
      - "8088:8080"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"

  redis-cluster:
    image: grokzen/redis-cluster:7.2.0
    environment:
      - IP=0.0.0.0
      - STANDALONE=false
    ports:
      - "7000-7005:7000-7005"

  travel-agent-api:
    image: enterprise-travel-agent-api:local
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/services/techgroup-enterprise-travel-runtime
      - TRAVEL_REGISTRY=nacos-real
      - NACOS_SERVER_ADDR=http://nacos:8848
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
      - TRAVEL_ETCD_CLIENT_MODE=legacy
      - TRAVEL_INTERNAL_CLIENT_ID=techgroup-enterprise-travel-gateway
      - TRAVEL_INTERNAL_SHARED_SECRET=${TRAVEL_INTERNAL_SHARED_SECRET:}
      - TRAVEL_AUTH_MODE=internal
      - TRAVEL_OIDC_ISSUER=http://keycloak:8080/realms/travel
      - TRAVEL_EVENT_BUS=pulsar
      - PULSAR_SERVICE_URL=pulsar://pulsar:6650
      - TRAVEL_ORCHESTRATION_ENGINE=langgraph
      - TRAVEL_ORCHESTRATION_FALLBACK_ENGINE=langgraph
      - TRAVEL_ORCHESTRATION_STRICT=false
      - TRAVEL_MEMORY_BACKEND=redis
      - TRAVEL_REDIS_MODE=cluster
      - TRAVEL_REDIS_URL=redis://redis-cluster:7000
      - TRAVEL_VECTOR_BACKEND=qdrant
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - nacos
      - etcd
      - pulsar
      - qdrant
      - redis-cluster
