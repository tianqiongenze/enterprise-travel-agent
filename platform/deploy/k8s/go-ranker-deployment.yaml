apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-ranker
spec:
  replicas: 4
  selector:
    matchLabels:
      app: go-ranker
  template:
    metadata:
      labels:
        app: go-ranker
    spec:
      containers:
      - name: go-ranker
        image: your-registry/go-ranker:0.1.0
        ports:
        - containerPort: 8090
        env:
        - name: GO_RANKER_PORT
          value: '8090'
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1500m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 15
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
