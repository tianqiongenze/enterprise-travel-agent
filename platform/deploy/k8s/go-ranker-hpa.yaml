apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-ranker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-ranker
  minReplicas: 4
  maxReplicas: 80
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
