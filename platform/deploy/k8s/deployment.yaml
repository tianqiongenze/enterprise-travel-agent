apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-agent-api
spec:
  replicas: 24
  selector:
    matchLabels:
      app: travel-agent-api
  template:
    metadata:
      labels:
        app: travel-agent-api
    spec:
      containers:
        - name: travel-agent-api
          image: your-registry/travel-agent-api:0.1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: TRAVEL_REGISTRY
              value: "nacos-real"
            - name: NACOS_SERVER_ADDR
              value: "http://nacos.default.svc.cluster.local:8848"
            - name: ETCD_HOST
              value: "etcd.default.svc.cluster.local"
            - name: ETCD_PORT
              value: "2379"
            - name: TRAVEL_ETCD_CLIENT_MODE
              value: "legacy"
            - name: TRAVEL_RANKER_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_RANKER_BACKEND
            - name: TRAVEL_GO_RANKER_URL
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_GO_RANKER_URL
            - name: TRAVEL_GO_RANKER_TRANSPORT
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_GO_RANKER_TRANSPORT
                  optional: true
            - name: TRAVEL_GO_RANKER_GRPC_TARGET
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_GO_RANKER_GRPC_TARGET
                  optional: true
            - name: TRAVEL_GO_RANKER_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_GO_RANKER_TIMEOUT
            - name: TRAVEL_GO_RANKER_SHADOW
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_GO_RANKER_SHADOW
                  optional: true
            - name: TRAVEL_GO_RANKER_DIFF_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_GO_RANKER_DIFF_THRESHOLD
                  optional: true
            - name: TRAVEL_INFLIGHT_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_INFLIGHT_LIMIT
                  optional: true
            - name: TRAVEL_LOCAL_INFLIGHT_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: travel-agent-env
                  key: TRAVEL_LOCAL_INFLIGHT_LIMIT
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
