resources:
  - ../../base

patchesStrategicMerge:
  - replica-patch.yaml

configMapGenerator:
  - name: travel-agent-env
    literals:
      - TRAVEL_RANKER_BACKEND=go
      - TRAVEL_GO_RANKER_URL=http://go-ranker.default.svc.cluster.local
      - TRAVEL_GO_RANKER_TIMEOUT=0.4
      - TRAVEL_GO_RANKER_SHADOW=true
      - TRAVEL_GO_RANKER_DIFF_THRESHOLD=0.08
      - TRAVEL_POLICY_BACKEND=go
      - TRAVEL_GO_POLICY_URL=http://go-policy.default.svc.cluster.local
      - TRAVEL_POLICY_SHADOW=true
      - TRAVEL_REGISTRY_CACHE_BACKEND=go
      - TRAVEL_REGISTRY_CACHE_URL=http://go-registry-cache.default.svc.cluster.local
      - TRAVEL_INFLIGHT_LIMIT=64
      - TRAVEL_LOCAL_INFLIGHT_LIMIT=16
      - CANARY_GATE_MAX_SUCCESS_GAP=0.03
      - CANARY_GATE_MAX_P95_DRIFT=0.08
      - CANARY_GATE_MAX_P99_DRIFT=0.10

# Staging retest runs from locally loaded images (kind load docker-image),
# not from a remote registry.
images:
  - name: your-registry/travel-agent-api
    newName: enterprise-travel-agent-api
    newTag: staging
  - name: your-registry/go-ranker
    newName: enterprise-travel-agent-go-ranker
    newTag: local
  - name: your-registry/go-policy
    newName: enterprise-travel-agent-go-policy
    newTag: local
  - name: your-registry/go-fanout
    newName: enterprise-travel-agent-go-fanout
    newTag: local
  - name: your-registry/go-registry-cache
    newName: enterprise-travel-agent-go-registry-cache
    newTag: local
