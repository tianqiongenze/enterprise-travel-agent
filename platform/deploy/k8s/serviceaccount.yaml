apiVersion: v1
kind: ServiceAccount
metadata:
  name: travel-agent-api
  labels:
    app: travel-agent-api
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-registry-cache-sa
  labels:
    app: go-registry-cache
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-registry-cache-endpoints-reader
  labels:
    app: go-registry-cache
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-registry-cache-endpoints-reader
  labels:
    app: go-registry-cache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: go-registry-cache-endpoints-reader
subjects:
  - kind: ServiceAccount
    name: go-registry-cache-sa
    namespace: default
