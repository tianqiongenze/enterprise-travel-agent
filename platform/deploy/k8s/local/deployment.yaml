apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-agent-api-local
  namespace: travel-local
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-agent-api-local
  template:
    metadata:
      labels:
        app: travel-agent-api-local
    spec:
      containers:
      - name: travel-agent-api
        image: enterprise-travel-agent-api:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: TRAVEL_REGISTRY
          value: nacos-real
        - name: NACOS_SERVER_ADDR
          value: http://nacos:8848
        - name: ETCD_HOST
          value: etcd
        - name: ETCD_PORT
          value: '2379'
        - name: TRAVEL_ETCD_CLIENT_MODE
          value: legacy
        - name: TRAVEL_EVENT_BUS
          value: local
        - name: PULSAR_SERVICE_URL
          value: pulsar://pulsar:6650
        - name: TRAVEL_MEMORY_BACKEND
          value: memory
        - name: TRAVEL_VECTOR_BACKEND
          value: qdrant
        - name: QDRANT_URL
          value: http://qdrant:6333
        - name: TRAVEL_A2A_TRANSPORT
          value: mock-distributed
        - name: TRAVEL_ORCHESTRATION_ENGINE
          value: langgraph
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: tmp
        emptyDir: {}
