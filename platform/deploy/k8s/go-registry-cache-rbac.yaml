apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-registry-cache-sa

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-registry-cache-role
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-registry-cache-rolebinding
subjects:
  - kind: ServiceAccount
    name: go-registry-cache-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: go-registry-cache-role
