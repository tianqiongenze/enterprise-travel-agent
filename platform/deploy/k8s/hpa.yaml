apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: travel-agent-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: travel-agent-api
  minReplicas: 24
  maxReplicas: 600
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
