<text x="90" y="170" font-size="14" font-family="Consolas" fill="#E2E8F0">import os</text><text x="90" y="188" font-size="14" font-family="Consolas" fill="#E2E8F0">import importlib</text><text x="90" y="206" font-size="14" font-family="Consolas" fill="#E2E8F0">import importlib.util</text><text x="90" y="224" font-size="14" font-family="Consolas" fill="#E2E8F0">from typing import Any, Dict, Optional</text><text x="90" y="242" font-size="14" font-family="Consolas" fill="#E2E8F0">import hashlib</text><text x="90" y="260" font-size="14" font-family="Consolas" fill="#E2E8F0"></text><text x="90" y="278" font-size="14" font-family="Consolas" fill="#E2E8F0">fastapi_module = importlib.util.find_spec(&quot;fastapi&quot;)</text><text x="90" y="296" font-size="14" font-family="Consolas" fill="#E2E8F0">FastAPI: Any = None</text><text x="90" y="314" font-size="14" font-family="Consolas" fill="#E2E8F0">FastAPIRequest: Any = None</text><text x="90" y="332" font-size="14" font-family="Consolas" fill="#E2E8F0">if fastapi_module is not None:</text><text x="90" y="350" font-size="14" font-family="Consolas" fill="#E2E8F0">    fastapi_loaded = importlib.import_module(&quot;fastapi&quot;)</text><text x="90" y="368" font-size="14" font-family="Consolas" fill="#E2E8F0">    FastAPI = getattr(fastapi_loaded, &quot;FastAPI&quot;)</text><text x="90" y="386" font-size="14" font-family="Consolas" fill="#E2E8F0">    FastAPIRequest = getattr(fastapi_loaded, &quot;Request&quot;)</text><text x="90" y="404" font-size="14" font-family="Consolas" fill="#E2E8F0"></text><text x="90" y="422" font-size="14" font-family="Consolas" fill="#E2E8F0">from ..models import TravelRequest</text><text x="90" y="440" font-size="14" font-family="Consolas" fill="#E2E8F0">from ..orchestrator import build_orchestrator</text><text x="90" y="458" font-size="14" font-family="Consolas" fill="#E2E8F0"></text><text x="90" y="476" font-size="14" font-family="Consolas" fill="#E2E8F0">project_root = os.path.abspath(os.path.join(os.path.dirname(__file__), &quot;..&quot;, &quot;..&quot;, &quot;..&quot;))</text><text x="90" y="494" font-size="14" font-family="Consolas" fill="#E2E8F0">orchestrator = build_orchestrator(project_root)</text><text x="90" y="512" font-size="14" font-family="Consolas" fill="#E2E8F0">shared_secret = os.getenv(&quot;TRAVEL_INTERNAL_SHARED_SECRET&quot;, &quot;demo-internal-secret&quot;)</text><text x="90" y="530" font-size="14" font-family="Consolas" fill="#E2E8F0"># ...truncated...</text>
